name: Solver

# Runs when the Rust source or the catalog it is built from changes.
on:
  push:
    paths:
      - 'packages/simulation/solver/**'
      - 'packages/simulation/content/**'
      - 'packages/qmc/**'
      - '.github/workflows/solver.yml'
  pull_request:
    paths:
      - 'packages/simulation/solver/**'
      - 'packages/simulation/content/**'
      - 'packages/qmc/**'
      - '.github/workflows/solver.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  solver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/simulation/solver
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      # The crate includes src/catalog.rs, which qmc writes from the content.
      - run: cargo run --release --manifest-path ../../qmc/Cargo.toml -- build ../content ../src/generated --solver src/catalog.rs
      - run: cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --release --tests -- -D warnings
      - run: cargo test --release
