    <!-- The title screen is dark: paint the first frame to match it. -->
    <style>
      @font-face {
        font-family: 'Geist';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/geist-latin-v5.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/geist-mono-latin-v6.woff2') format('woff2');
      }
      html {
        background: #141517;
      }
      /* The game is one large module. Show this until it mounts, then Foldkit replaces #root. */
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: #141517;
        color: #eaebec;
        font-family: 'Geist', system-ui, sans-serif;
        animation: boot-in 160ms 250ms both;
      }
      .boot-word {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.04em;
      }
      .boot-bar {
        width: 84px;
        height: 2px;
        overflow: hidden;
        border-radius: 1px;
        background: #2c2f34;
      }
      .boot-bar::after {
        content: '';
        display: block;
        width: 36%;
        height: 100%;
        background: #58cef8;
        animation: boot-slide 1s ease-in-out infinite;
      }
      .boot-note {
        color: #9aa0a6;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(280%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot {
          animation: none;
        }
        .boot-bar::after {
          width: 100%;
          opacity: 0.5;
          animation: none;
        }
      }
      noscript {
        display: block;
        padding: 24px;
        color: #eaebec;
        font-family: system-ui, sans-serif;
      }
      noscript a {
        color: #58cef8;
      }
    </style>
