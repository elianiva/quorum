<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f2f4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="https://playquorum.dev/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/geist-latin-v5.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist-mono-latin-v6.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      ;(() => {
        const root = document.documentElement
        let theme
        try {
          const stored = localStorage.getItem('quorum.wiki.theme')
          theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        } catch {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        root.classList.toggle('dark', theme === 'dark')
        root.dataset.theme = theme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#141517' : '#f1f2f4')
      })()
    </script>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/site/entry.client.ts"></script>
  </body>
</html>
